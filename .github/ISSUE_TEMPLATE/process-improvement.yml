name: Process Improvement
description: 반복업무, 병목, SOP 또는 자동화 개선을 등록합니다.
title: "[PROCESS] "
labels: ["process"]
body:
  - type: textarea
    id: current
    attributes:
      label: 현재 방식
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 문제와 반복 빈도
    validations:
      required: true
  - type: dropdown
    id: solution
    attributes:
      label: 우선 해결 방식
      options:
        - SOP
        - Knowledge
        - Prompt
        - Agent
        - Automation
        - Decision
