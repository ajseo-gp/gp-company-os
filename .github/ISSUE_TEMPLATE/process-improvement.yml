name: Process Improvement
description: 반복업무, 병목, SOP 또는 자동화 개선을 등록합니다.
title: "[PROCESS] "
labels: ["process"]
body:
  - type: textarea
    id: current
    attributes:
      label: 현재 방식
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 문제와 반복 빈도
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 발생 근거와 영향
      description: 빈도, 소요시간, 오류, 고객 또는 매출 영향을 기록합니다.
    validations:
      required: true
  - type: dropdown
    id: solution
    attributes:
      label: 우선 해결 방식
      options:
        - SOP
        - Knowledge
        - Prompt
        - Agent
        - Automation
        - Decision
  - type: textarea
    id: measure
    attributes:
      label: 완료 조건과 측정 지표
    validations:
      required: true
